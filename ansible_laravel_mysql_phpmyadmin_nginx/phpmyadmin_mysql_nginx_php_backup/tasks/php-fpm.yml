# @format
---
- name: Cleanup old PHP installation (fix install bug)
  become: true
  shell: |
    apt-get -f install -y
    apt-get purge -y php{{ php_fpm_version }}-fpm php{{ php_fpm_version }} php-fpm php
    apt-get autoremove -y --purge
    apt-get clean
    rm -rf /etc/php/{{ php_fpm_version }} /etc/php
  ignore_errors: yes

